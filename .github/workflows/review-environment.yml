name: Temporary review environment

on:
  workflow_dispatch:
    inputs:
      lifetime_minutes:
        description: Review environment lifetime
        required: true
        default: "60"
        type: choice
        options:
          - "30"
          - "45"
          - "60"

permissions:
  contents: read

concurrency:
  group: rabbit-temporary-review
  cancel-in-progress: true

jobs:
  review-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Start exact full-stack build
        run: |
          cp .env.example .env
          LOGIN_LOCK_DURATION=PT2S docker compose up --detach --build

      - name: Start temporary HTTPS tunnel
        run: |
          docker run --detach \
            --name rabbit-review-tunnel \
            --network host \
            cloudflare/cloudflared:latest \
            tunnel --no-autoupdate --url http://127.0.0.1:80

      - name: Resolve review URL
        id: review
        run: |
          for attempt in $(seq 1 60); do
            review_url="$(
              docker logs rabbit-review-tunnel 2>&1 \
                | grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' \
                | tail -1 \
                || true
            )"
            if [[ -n "${review_url}" ]]; then
              break
            fi
            if [[ "${attempt}" == "60" ]]; then
              docker logs rabbit-review-tunnel >&2
              exit 1
            fi
            sleep 2
          done
          echo "url=${review_url}" >> "${GITHUB_OUTPUT}"
          {
            echo "Review URL: ${review_url}"
            echo "Commit SHA: ${GITHUB_SHA}"
            echo "Lifetime minutes: ${{ inputs.lifetime_minutes }}"
          } > review-environment.txt
          echo "::notice title=Rabbit review URL::${review_url}"

      - name: Bind invitation links to review URL
        env:
          REVIEW_URL: ${{ steps.review.outputs.url }}
        run: |
          LOGIN_LOCK_DURATION=PT2S \
          INVITATION_ACTIVATION_BASE_URL="${REVIEW_URL}/activate" \
            docker compose up --detach --no-deps --force-recreate backend

      - name: Verify release-hardening journey
        run: ./infra/pilot/smoke.sh
        env:
          RABBIT_SMOKE_LOCK_WAIT_SECONDS: 3

      - name: Publish review endpoint
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-review-environment
          path: review-environment.txt
          retention-days: 1

      - name: Keep environment available
        env:
          REVIEW_URL: ${{ steps.review.outputs.url }}
          REVIEW_LIFETIME_MINUTES: ${{ inputs.lifetime_minutes }}
        run: |
          {
            echo "## Rabbit temporary review"
            echo
            echo "- URL: ${REVIEW_URL}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Lifetime: ${REVIEW_LIFETIME_MINUTES} minutes"
          } >> "${GITHUB_STEP_SUMMARY}"
          sleep "$((REVIEW_LIFETIME_MINUTES * 60))"

      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Stop temporary environment
        if: always()
        run: |
          docker rm --force rabbit-review-tunnel 2>/dev/null || true
          docker compose down --volumes
