name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode verify

  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rabbit
          POSTGRES_USER: rabbit
          POSTGRES_PASSWORD: rabbit_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rabbit -d rabbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: rabbit_ci_password
    steps:
      - uses: actions/checkout@v5
      - name: Apply PostgreSQL migrations
        run: |
          for migration in backend/src/main/resources/db/migration/V*.sql; do
            psql -h localhost -U rabbit -d rabbit -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify tenant-isolation contracts
        run: psql -h localhost -U rabbit -d rabbit -f infra/database/verify_tenant_isolation.sql

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, backend, database-contract]
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag rabbit-aip-api:ci backend
      - run: docker build --tag rabbit-aip-web:ci frontend
