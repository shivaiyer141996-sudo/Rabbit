name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode verify

  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rabbit
          POSTGRES_USER: rabbit
          POSTGRES_PASSWORD: rabbit_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rabbit -d rabbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: rabbit_ci_password
    steps:
      - uses: actions/checkout@v6
      - name: Verify functional enhancement contracts
        run: python3 infra/enhancements/verify-enhancement-contract.py
      - name: Apply PostgreSQL migrations
        run: |
          for migration in backend/src/main/resources/db/migration/V*.sql; do
            psql -h localhost -U rabbit -d rabbit -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify tenant-isolation contracts
        run: psql -h localhost -U rabbit -d rabbit -f infra/database/verify_tenant_isolation.sql

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, backend, database-contract, secret-scan]
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag rabbit-aip-api:ci backend
      - run: docker build --tag rabbit-aip-web:ci frontend
      - name: Scan backend production dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rabbit-aip-api:ci
          format: table
          scanners: vuln
          severity: CRITICAL
          exit-code: 1
      - name: Scan frontend production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rabbit-aip-web:ci
          format: table
          scanners: vuln
          severity: CRITICAL
          exit-code: 1
          skip-setup-trivy: true
      - name: Start complete pilot stack
        run: |
          cp .env.example .env
          LOGIN_LOCK_DURATION=PT2S docker compose up --detach --build
      - name: Verify live authenticated pilot journey
        run: ./infra/pilot/smoke.sh
        env:
          RABBIT_SMOKE_LOCK_WAIT_SECONDS: 3
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop pilot stack
        if: always()
        run: docker compose down --volumes
