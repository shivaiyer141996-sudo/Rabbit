name: Release tag verification

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag, versions, main ancestry, and local-only policy
        run: ./infra/release/verify-release-tag.sh "${GITHUB_REF_NAME}"
      - name: Resolve release version
        id: release
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: backend
      - name: Build exact local release images without publishing
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build \
            --build-arg "RABBIT_RELEASE_VERSION=${version}" \
            --build-arg "RABBIT_RELEASE_COMMIT=${GITHUB_SHA}" \
            --tag "rabbit-aip-api:${version}" backend
          docker build \
            --build-arg "RABBIT_RELEASE_VERSION=${version}" \
            --build-arg "RABBIT_RELEASE_COMMIT=${GITHUB_SHA}" \
            --tag "rabbit-aip-web:${version}" frontend
      - name: Scan exact local release images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rabbit-aip-api:${{ steps.release.outputs.version }}
          format: table
          scanners: vuln
          severity: CRITICAL
          exit-code: 1
      - name: Scan exact local web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rabbit-aip-web:${{ steps.release.outputs.version }}
          format: table
          scanners: vuln
          severity: CRITICAL
          exit-code: 1
          skip-setup-trivy: true
