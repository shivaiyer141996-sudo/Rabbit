name: rabbit-aip

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rabbit}
      POSTGRES_USER: ${POSTGRES_USER:-rabbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rabbit_local_password}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rabbit} -d ${POSTGRES_DB:-rabbit}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_local_queue_password}
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rabbit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rabbit_local_minio_password}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - data

  backend:
    init: true
    stop_grace_period: 30s
    image: rabbit-aip-api:${RABBIT_RELEASE_VERSION:-local}
    build:
      context: ./backend
      args:
        RABBIT_RELEASE_VERSION: ${RABBIT_RELEASE_VERSION:-local}
        RABBIT_RELEASE_COMMIT: ${RABBIT_RELEASE_COMMIT:-unversioned}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rabbit}}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-${POSTGRES_USER:-rabbit}}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-rabbit_local_password}}
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-20}
      DATABASE_MIN_IDLE: ${DATABASE_MIN_IDLE:-2}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-10000}
      DATABASE_VALIDATION_TIMEOUT_MS: ${DATABASE_VALIDATION_TIMEOUT_MS:-3000}
      DATABASE_MAX_LIFETIME_MS: ${DATABASE_MAX_LIFETIME_MS:-1800000}
      DATABASE_MIGRATION_LOCATIONS: ${DATABASE_MIGRATION_LOCATIONS:-classpath:db/migration}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-rabbit_local_queue_password}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-rabbit}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-rabbit_local_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-question-assets}
      JWT_SECRET: ${JWT_SECRET:-rabbit-local-development-secret-change-me}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCK_DURATION: ${LOGIN_LOCK_DURATION:-PT30M}
      INVITATION_TTL: ${INVITATION_TTL:-PT72H}
      INVITATION_ACTIVATION_BASE_URL: ${INVITATION_ACTIVATION_BASE_URL:-http://localhost/activate}
      RABBIT_RELEASE_VERSION: ${RABBIT_RELEASE_VERSION:-1.0.0}
      RABBIT_ENVIRONMENT: ${RABBIT_ENVIRONMENT:-local}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_ANONYMOUS_PER_MINUTE: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:-20}
      RATE_LIMIT_AUTHENTICATED_PER_MINUTE: ${RATE_LIMIT_AUTHENTICATED_PER_MINUTE:-300}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - app
      - data

  frontend:
    init: true
    image: rabbit-aip-web:${RABBIT_RELEASE_VERSION:-local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/gateway/backend}
        RABBIT_RELEASE_VERSION: ${RABBIT_RELEASE_VERSION:-local}
        RABBIT_RELEASE_COMMIT: ${RABBIT_RELEASE_COMMIT:-unversioned}
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080/api/v1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - app

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${RABBIT_BIND_ADDRESS:-127.0.0.1}:${RABBIT_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:

networks:
  app:
  data:
    internal: true
