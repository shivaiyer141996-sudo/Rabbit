worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  client_max_body_size 12m;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 65s;
  proxy_send_timeout 30s;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;

  limit_req_zone $binary_remote_addr zone=rabbit_auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=rabbit_api:10m rate=20r/s;

  upstream rabbit_frontend {
    server frontend:3000;
    keepalive 16;
  }

  upstream rabbit_backend {
    server backend:8080;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;
    error_page 429 = @rate_limit_json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    location @rate_limit_json {
      default_type application/json;
      return 429 '{"status":429,"code":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Please wait before trying again."}';
    }

    location = /gateway/auth/login {
      limit_req zone=rabbit_auth burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://rabbit_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Trace-Id $request_id;
    }

    location /api/actuator/health/ {
      proxy_pass http://rabbit_backend/actuator/health/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Trace-Id $request_id;
    }

    location = /api/actuator/health {
      proxy_pass http://rabbit_backend/actuator/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Trace-Id $request_id;
    }

    location /api/ {
      limit_req zone=rabbit_api burst=40 nodelay;
      limit_req_status 429;
      proxy_pass http://rabbit_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Trace-Id $request_id;
    }

    location / {
      proxy_pass http://rabbit_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Trace-Id $request_id;
    }
  }
}
