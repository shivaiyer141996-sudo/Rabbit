spring:
  application:
    name: rabbit-aip-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rabbit}
    username: ${DATABASE_USERNAME:rabbit}
    password: ${DATABASE_PASSWORD:rabbit_local_password}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:20}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:3000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: ${DATABASE_MIGRATION_LOCATIONS:classpath:db/migration}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:rabbit}
    password: ${RABBITMQ_PASSWORD:rabbit_local_queue_password}
    connection-timeout: 3s
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
  error:
    include-message: never
    include-stacktrace: never

management:
  observations:
    key-values:
      application: rabbit-aip-api
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: rabbit-aip-api
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: Rabbit AiP
    version: 1.0.0
    milestone: Release 1.0 Milestone 4.2 Functional and UI Completion

rabbit:
  attempt-expiry:
    fixed-delay-ms: ${ATTEMPT_EXPIRY_FIXED_DELAY_MS:5000}
  jwt:
    secret: ${JWT_SECRET:rabbit-local-development-secret-change-me}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:rabbit}
    secret-key: ${MINIO_SECRET_KEY:rabbit_local_minio_password}
    bucket: ${MINIO_BUCKET:question-assets}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost}
  security:
    authentication:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:PT30M}
    invitation:
      ttl: ${INVITATION_TTL:PT72H}
      activation-base-url: ${INVITATION_ACTIVATION_BASE_URL:http://localhost/activate}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      anonymous-per-minute: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:20}
      authenticated-per-minute: ${RATE_LIMIT_AUTHENTICATED_PER_MINUTE:300}
  release:
    version: ${RABBIT_RELEASE_VERSION:1.0.0}
    environment: ${RABBIT_ENVIRONMENT:local}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}] [orgId=%X{orgId:-}] [userId=%X{userId:-}]"
